name: CI

# Checks every pull request and every push to main. Keyless: no secrets are used or
# needed and nothing calls the live API. Job names are part of the contract (they become
# required checks), so rename them only deliberately. Notebook execution (#69) will be
# added as further jobs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev extra pins ruff)
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  catalog:
    name: Catalog (README is current)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      # The renderer uses only the standard library, so nothing is installed here.
      - name: render_catalog --check
        run: python tools/render_catalog.py --check

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The package floor and the newest interpreter contributors use locally.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Both legs install the `ml` extra (scikit-learn), because every recipe's helpers.py and
      # tests/ are imported here and docs/notebook-ci.md tells an author the extra is available to
      # them (#238). The notebook constraints are NOT applied: numpy==2.5.3 needs Python >= 3.12,
      # so the file cannot be installed on the 3.10 floor. Both legs therefore take the newest
      # release that supports their interpreter (3.10: scikit-learn 1.7.2; 3.14: 1.9.1), which
      # differ from each other and from the notebook job's pin, so a helpers test must assert
      # properties of a trained model and never numbers that depend on the scikit-learn version.
      # py3.14 also installs the optional SDK so tests/test_live_sdk.py runs; py3.10 does not,
      # proving the package and all offline tests work with the SDK absent.
      - name: Install
        run: pip install -e ".[dev,ml${{ matrix.python-version == '3.14' && ',live' || '' }}]"
      - name: pytest
        run: pytest
