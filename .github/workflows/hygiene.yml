name: Hygiene

# Secret, local-path and notebook-output checks. A separate workflow from ci.yml so that
# notebook jobs (#69) can be added there without conflicts. Keyless: no secrets are used.
# The job name is part of the contract (it can become a required check).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene (secrets and notebook outputs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      # Standard library only, so nothing is installed.
      - name: check_hygiene (every tracked file)
        run: python tools/check_hygiene.py
      # The image-file contract (#307): where recipe images live, their format, size and
      # metadata. Also standard library only. See docs/fixtures.md, "Image fixtures".
      - name: check_recipe_assets (every tracked file under recipes/)
        run: python tools/check_recipe_assets.py
