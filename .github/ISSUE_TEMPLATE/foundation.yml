name: Foundation
description: Shared code, tooling, CI, or documentation that recipes depend on.
title: "Foundation: "
labels: ["type: foundation"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this enables and which recipes or issues are waiting on it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that make this done.
    validations:
      required: true
