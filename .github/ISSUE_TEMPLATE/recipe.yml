name: Recipe
description: Propose or track a cookbook recipe.
title: "Recipe NN: "
labels: ["type: recipe"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: One sentence. What bounded decision does the notebook make, and what does Python do with it?
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Difficulty level
      options: ["1 Beginner", "2 Easy", "3 Intermediate", "4 Advanced", "5 Expert"]
    validations:
      required: true
  - type: checkboxes
    id: decision-types
    attributes:
      label: Decision types
      options:
        - label: Choice
        - label: Noul
        - label: Score
        - label: Box
  - type: textarea
    id: fixtures
    attributes:
      label: Fixtures and evaluation
      description: What synthetic data is needed, which hard cases it must include, and how the result is evaluated. More than one Noul proposition in one request? Say what positive examples, truth combinations, and outcome-changing cases each proposition's fixtures need.
  - type: textarea
    id: image-assets
    attributes:
      label: Image assets and provenance
      description: Optional. Any recipe that uses images lists each image, where it comes from, and its license. Follow the "Image provenance manifest" section of docs/fixtures.md.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Documentation that supports the pattern.
